<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 화면에 딱 맞게 확대/축소 고정하는 필수 코드 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>가상 캐릭터 핸드폰</title>
    <style>
        /* 모든 요소의 테두리, 여백 계산을 깔끔하게 맞추는 코드 */
        * { box-sizing: border-box; } 

        body {
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        }

        /* 스마트폰 외곽 프레임 */
        .phone-frame {
            width: 375px;
            height: 812px;
            max-width: 100vw;   /* 모바일로 볼 때 화면에 꽉 차게 */
            max-height: 100vh;  /* 위아래 짤림 방지 */
            background-color: #b2c7d9; /* 카카오톡 배경색 */
            border-radius: 40px;
            border: 12px solid #333; /* 핸드폰 테두리 검은색 */
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 스마트폰 모서리를 화면 크기에 따라 자연스럽게 조절 */
        @media (max-width: 400px) {
            .phone-frame { border-radius: 0; border: none; }
        }

        /* 상단바 (시간, 배터리 등) */
        .status-bar {
            height: 44px;
            background-color: transparent;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            font-weight: bold;
            z-index: 10;
        }

        /* 채팅 영역 */
        .chat-room {
            flex: 1;
            padding: 20px 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            /* 스크롤바 숨기기 (깔끔한 화면을 위해) */
            -ms-overflow-style: none; 
            scrollbar-width: none; 
        }
        .chat-room::-webkit-scrollbar { display: none; }

        /* 상대방 메시지 */
        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .profile-pic {
            width: 42px;
            height: 42px;
            background-color: #ddd;
            border-radius: 16px; /* 프사 둥글게 */
            object-fit: cover;
        }
        .message-content {
            display: flex;
            flex-direction: column;
        }
        .sender-name {
            font-size: 13px;
            color: #444;
            margin-bottom: 4px;
        }
        .bubble {
            background-color: #fff;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            max-width: 220px;
            word-wrap: break-word;
            line-height: 1.4;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        /* 내 캐릭터 메시지 (오른쪽 정렬) */
        .message-row.me {
            flex-direction: row-reverse;
        }
        .message-row.me .bubble {
            background-color: #fee500; /* 카톡 노란색 */
        }

        /* 하단 입력창 느낌 (장식용) */
        .input-bar {
            height: 60px;
            background-color: #fff;
            display: flex;
            align-items: center;
            padding: 0 15px;
        }
        .input-box {
            flex: 1;
            height: 38px;
            background-color: #f0f0f0;
            border-radius: 20px;
            padding: 0 15px;
            display: flex;
            align-items: center;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- 상단 상태바 -->
        <div class="status-bar">
            <span>14:08</span>
            <span>100% 🔋</span>
        </div>

        <!-- 채팅 내용 -->
        <div class="chat-room">
            
            <!-- 상대방 메시지 1 -->
            <div class="message-row">
                <!-- 프로필 이미지 (아래 주소를 다른 이미지 주소로 바꾸면 프사가 바뀝니다) -->
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" class="profile-pic" alt="프로필">
                <div class="message-content">
                    <span class="sender-name">의문의 인물</span>
                    <div class="bubble">여기가 어디지...? 내 폰에 이상한 앱이 깔렸어.</div>
                </div>
            </div>

            <!-- 내 캐릭터의 메시지 (오른쪽 노란색) -->
            <div class="message-row me">
                <div class="message-content">
                    <div class="bubble">누구세요? 제 폰에 어떻게 연락하신 거죠?</div>
                </div>
            </div>

            <!-- 상대방 메시지 2 -->
            <div class="message-row">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" class="profile-pic" alt="프로필">
                <div class="message-content">
                    <span class="sender-name">의문의 인물</span>
                    <div class="bubble">일단 진정하고 내 말 좀 들어봐.</div>
                </div>
            </div>

        </div>

        <!-- 하단 입력창 -->
        <div class="input-bar">
            <div class="input-box">메시지 입력...</div>
        </div>
    </div>

</body>
</html>
